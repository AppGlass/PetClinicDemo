<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../static/resources/css/petclinic.css" />
</head>

<body>

  <section class="admin-portal">
    <div class="admin-header">
      <div class="admin-title">
        <p class="admin-kicker">Admin console</p>
        <h2>PetClinic Admin Panel</h2>
        <p class="admin-description" th:text="#{rooms.homeDescription}">Manage pet owners, visits and clinic rooms.</p>
      </div>
      <div class="admin-actions">
        <form method="post" th:action="@{/sms/all}">
          <button type="submit" class="admin-btn admin-btn--outline">Send SMS to All</button>
        </form>
        <form method="post" th:action="@{/emails/process}">
          <button type="submit" class="admin-btn admin-btn--outline">Process email DB</button>
        </form>
      </div>
    </div>

    <p th:if="${message}" th:text="${message}" class="alert alert-info" role="status"></p>

    <nav class="admin-tabs" aria-label="Admin sections">
      <a class="admin-tab active" th:href="@{/}" aria-current="page">Overview</a>
      <a class="admin-tab" th:href="@{/owners/find}" th:text="#{owners}">Owners</a>
      <a class="admin-tab" th:href="@{/rooms}" th:text="#{rooms}">Rooms</a>
    </nav>
  </section>

</body>

</html>
