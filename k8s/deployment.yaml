apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
        app-glass: "true"
    spec:
      containers:
        - name: petclinic
          # Image pushed to GHCR by `./gradlew jib`.
          # Keep the tag in sync with `version` in build.gradle.
          image: ghcr.io/appglass/petclinicdemo:4.0.0-AppGlass
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /petclinic
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Spring Boot exposes these actuator probe groups automatically
          # when it detects it is running inside Kubernetes.
          startupProbe:
            httpGet:
              path: /petclinic/actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /petclinic/actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /petclinic/actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
