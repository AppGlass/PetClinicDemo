name: Publish PetClinic

on:
  push:
    tags: ['4.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Publish amd64 and arm64 images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          test "$GITHUB_REF_NAME" = "$version"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ./gradlew jib -PsourceRevision="$GITHUB_SHA" --console=plain
